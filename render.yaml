services:
  - type: web
    name: tradeflow-api
    runtime: docker
    dockerfilePath: ./src/TradeFlow.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
      - key: ConnectionStrings__Redis
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
