name: Backend CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TradeFlow.sln
      - run: dotnet build TradeFlow.sln --no-restore --configuration Release
      - run: dotnet test TradeFlow.sln --no-build --configuration Release
